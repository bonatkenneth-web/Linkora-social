name: Trivy Container Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  trivy-scan:
    name: Trivy — container vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: indexer
            dockerfile: services/indexer/Dockerfile
            image: linkora/indexer
          - service: dm-relay
            dockerfile: services/dm-relay/Dockerfile
            image: linkora/dm-relay
          - service: analytics-oracle
            dockerfile: services/analytics-oracle/Dockerfile
            image: linkora/analytics-oracle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image — ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          # Fail CI on CRITICAL vulnerabilities
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Run Trivy HIGH severity scan (warning only) — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.28.0
        # Always run to collect results even if CRITICAL step fails
        if: always()
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF results — ${{ matrix.service }}
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Upload Trivy scan artifact — ${{ matrix.service }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-${{ matrix.service }}
          path: trivy-results-${{ matrix.service }}.sarif
          retention-days: 30
