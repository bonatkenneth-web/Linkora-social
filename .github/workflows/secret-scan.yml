name: Secret Scanning (TruffleHog)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  secret-scan:
    name: TruffleHog — secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required so TruffleHog can diff commits on PRs
          # and scan the complete branch history on push.
          fetch-depth: 0

      - name: Run TruffleHog secret scanner
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          # On PRs, scan only the commits introduced by the PR branch.
          # On push to main, compare HEAD against the previous commit.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          head: HEAD
          # Fail CI immediately if any verified secrets are found.
          # --fail exits with code 183 when secrets are detected.
          # --config points to the allowlist for test fixtures / false positives.
          extra_args: --only-verified --fail --config .trufflehog.yml
